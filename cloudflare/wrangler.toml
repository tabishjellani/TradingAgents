name = "tradingagents-pwa"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static asset binding pointing to Vite PWA build output
assets = { directory = "../frontend/dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[vars]
PYTHON_BACKEND_URL = "https://YOUR-DEPLOYED-BACKEND.example.com"
SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY"
RATE_LIMIT_PER_MINUTE = 60
